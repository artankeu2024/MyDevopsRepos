apiVersion: v1
kind: Service
metadata:
  name: flask-service
  labels:
    app: flask-app
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80        # Service port
      targetPort: 5000 # Container port
      nodePort: 30080  # Exposed port on worker nodes (30000-32767)
